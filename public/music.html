<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KINGZEVI — Music</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="CSS/style.css"/>
</head>
<body>
    <!-- ── HEADER ── -->
<header>
  <div class="logo"><a class="keep" href="/">KING<span>Z</span>EVI</a></div>
  <nav class="nav-links">
    <a onclick="goto('music')" class="keep">Music</a>
    <a href="/#community" class="keep">Community</a>
  </nav>
  <div class="header-auth" id="header-guest">
    <button class="btn-sm btn-outline" onclick="openAuth('login')">Sign In</button>
    <button class="btn-sm btn-gold" onclick="openAuth('register')">Join</button>
  </div>
  <div style="display:none" id="header-user">
    <div class="user-pill">
      <span class="u-avatar" id="h-avatar">🎧</span>
      <span class="u-name" id="h-name"></span>
      <span class="u-role fan" id="h-role"></span>
      <button class="btn-ghost-sm" onclick="logout()">Sign out</button>
    </div>
  </div>
</header>

<div class="overlay" id="auth-overlay">
  <div class="modal-box">
    <button class="close" onclick="closeAuth()">×</button>
    <h2 class="modal-title">Welcome</h2>
    <p class="modal-sub" id="auth-sub-text">Sign in to your account</p>
    <div class="auth-tabs">
      <button class="tab-btn active" id="atab-login" onclick="switchAuthTab('login')">Sign In</button>
      <button class="tab-btn" id="atab-reg" onclick="switchAuthTab('register')">Join</button>
    </div>
    <div class="auth-error" id="auth-err"></div>
    <div id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="l-email" placeholder="you@example.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="l-pass" placeholder="Password"/></div>
      <button class="btn-full btn-gold" onclick="doLogin()">Sign In →</button>
    </div>
    <div id="reg-form" style="display:none">
      <div class="form-group"><label>Username</label><input type="text" id="r-user" placeholder="yourname"/></div>
      <div class="form-group"><label>Email</label><input type="email" id="r-email" placeholder="you@example.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="r-pass" placeholder="Min. 6 characters"/></div>
      <div class="form-group">
        <label>I am a...</label>
        <div class="role-toggle">
          <button class="role-btn active" id="rb-fan" onclick="setRole('fan')">Fan</button>
          <button class="role-btn" id="rb-artist" onclick="setRole('artist')">Artist</button>
        </div>
      </div>
      <button class="btn-full btn-gold" onclick="doRegister()">Create Account →</button>
    </div>
    <div class="auth-switch" id="auth-switch">
      Don't have an account? <span onclick="switchAuthTab('register')">Join now</span>
    </div>
  </div>
</div>

<div class="overlay" id="album-overlay" onclick="if(event.target===this)closeAlbum()">
  <div class="album-modal">
    <button class="close" onclick="closeAlbum()">×</button>
    <div class="m-art" id="m-art">Album</div>
    <div class="m-title" id="m-title"></div>
    <div class="m-meta" id="m-meta"></div>
    <div class="track-list" id="m-tracks"></div>
  </div>
</div>
<!-- ── SINGLES ── -->
<section id="music">
  <p class="section-label">Singles</p>
  <h2 class="section-title">Latest Drops</h2>
  <div id="singles-grid" class="music-grid"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
</section>

<!-- ── ALBUMS ──  -->
<section id="albums" style="padding-top:0">
  <p class="section-label">Albums</p>
  <h2 class="section-title">Full Projects</h2>
  <div id="albums-grid" class="music-grid"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
</section>
<div class="player-bar" id="player">
  <div class="player-track">
    <div class="p-thumb" id="p-thumb">Music</div>
    <div><div class="p-name" id="p-name">-</div><div class="p-sub">KINGZEVI</div></div>
  </div>
  <div class="player-controls">
    <div class="player-btns">
      <button class="ctrl" onclick="prevTrack()">Prev</button>
      <button class="ctrl play" id="play-btn" onclick="togglePlay()">Play</button>
      <button class="ctrl" onclick="nextTrack()">Next</button>
    </div>
    <div class="player-progress">
      <span class="p-time" id="p-cur">0:00</span>
      <div class="p-track" onclick="seekTo(event)"><div class="p-fill" id="p-fill"></div></div>
      <span class="p-time" id="p-dur">0:00</span>
    </div>
  </div>
  <div class="vol-wrap"><span style="font-size:.8rem">Vol</span><input type="range" min="0" max="100" value="80"/></div>
</div>

<div class="toast" id="toast"></div>

<script src="/config.js"></script>
<script src="JS/helper.js"></script>
</body>
</html>
